<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Trading Competition</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3347;
      --text: #e8eaf0;
      --muted: #8b90a7;
      --claude: #f97316;
      --gpt: #22c55e;
      --gemini: #3b82f6;
      --spy: #a855f7;
      --red: #ef4444;
      --green: #22c55e;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    header {
      padding: 24px 20px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    #last-updated {
      font-size: 0.75rem;
      color: var(--muted);
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    /* ── Chart section ── */
    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .chart-card h2 {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 16px;
    }

    .chart-wrapper {
      position: relative;
      height: 320px;
    }

    @media (max-width: 600px) {
      .chart-wrapper { height: 220px; }
    }

    /* ── Portfolio cards ── */
    .portfolios-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .portfolio-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .portfolio-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--border);
    }

    .portfolio-card-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ai-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .portfolio-card-title span {
      font-weight: 700;
      font-size: 1rem;
    }

    .portfolio-value {
      text-align: right;
    }

    .portfolio-value .total {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .portfolio-value .return {
      font-size: 0.8rem;
      font-weight: 600;
    }

    .pos { color: var(--green); }
    .neg { color: var(--red); }
    .neu { color: var(--muted); }

    /* Holdings table */
    .holdings-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }

    .holdings-table th {
      color: var(--muted);
      text-align: right;
      padding: 8px 12px 6px;
      font-weight: 500;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .holdings-table th:first-child { text-align: left; }

    .holdings-table td {
      padding: 7px 12px;
      border-top: 1px solid var(--border);
      text-align: right;
      white-space: nowrap;
    }

    .holdings-table td:first-child { text-align: left; font-weight: 600; }

    .holdings-table tr:hover td { background: var(--surface2); }

    .cash-row td { color: var(--muted); font-style: italic; }

    /* Empty state */
    .empty-state {
      padding: 24px;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
    }

    /* Loading */
    #loading {
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
    }

    .spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 2px solid var(--border);
      border-top-color: var(--text);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Trades section */
    .trades-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .trades-card h2 {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
    }

    .trades-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }

    .trades-table th {
      color: var(--muted);
      text-align: left;
      padding: 8px 14px 6px;
      font-weight: 500;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .trades-table td {
      padding: 8px 14px;
      border-top: 1px solid var(--border);
    }

    .trades-table tr:hover td { background: var(--surface2); }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .badge-buy  { background: rgba(34,197,94,0.15);  color: var(--green); }
    .badge-sell { background: rgba(239,68,68,0.15);   color: var(--red);   }

    .ai-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 600;
    }

    .rationale { color: var(--muted); max-width: 280px; }

    @media (max-width: 700px) {
      .trades-table .hide-mobile { display: none; }
    }
  </style>
</head>
<body>

<header>
  <h1>AI Trading Competition</h1>
  <span id="last-updated"></span>
</header>

<div id="loading">
  <div class="spinner"></div>
  <div>Loading portfolio data…</div>
</div>

<main id="app" style="display:none">

  <section class="chart-card">
    <h2>% Return Since Inception</h2>
    <div class="chart-wrapper">
      <canvas id="perf-chart"></canvas>
    </div>
  </section>

  <section class="portfolios-grid" id="portfolios-grid"></section>

  <section class="trades-card">
    <h2>Trade Log</h2>
    <div id="trades-container"></div>
  </section>

</main>

<script>
const CACHE_BUST = () => `?v=${Date.now()}`;

async function fetchJSON(url) {
  const res = await fetch(url + CACHE_BUST());
  if (!res.ok) throw new Error(`Failed to fetch ${url}: ${res.status}`);
  return res.json();
}

function fmt(n, decimals = 2) {
  return n.toLocaleString("en-US", { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}

function fmtDollar(n) { return "$" + fmt(n); }

function fmtPct(n) {
  const sign = n >= 0 ? "+" : "";
  return sign + fmt(n) + "%";
}

function returnClass(n) { return n > 0 ? "pos" : n < 0 ? "neg" : "neu"; }

// ── Chart ──────────────────────────────────────────────────────────────────
function buildChart(history, portfolios) {
  const entries = history.entries || [];
  if (entries.length === 0) return;

  const spyStart = history.spy_start;

  const labels = entries.map(e => {
    const d = new Date(e.timestamp);
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  });

  function pctReturn(key, startVal) {
    return entries.map(e => {
      const v = e[key];
      if (v == null) return null;
      return ((v - startVal) / startVal) * 100;
    });
  }

  const datasets = [];

  for (const [key, p] of Object.entries(portfolios)) {
    const startVal = p.starting_cash;
    datasets.push({
      label: p.name,
      data: pctReturn(key, startVal),
      borderColor: p.color,
      backgroundColor: p.color + "18",
      tension: 0.3,
      pointRadius: entries.length < 20 ? 4 : 2,
      pointHoverRadius: 6,
      fill: false,
    });
  }

  // SPY benchmark
  if (spyStart) {
    datasets.push({
      label: "SPY",
      data: entries.map(e => e.spy != null ? ((e.spy - spyStart) / spyStart) * 100 : null),
      borderColor: "#a855f7",
      backgroundColor: "#a855f718",
      tension: 0.3,
      pointRadius: entries.length < 20 ? 4 : 2,
      pointHoverRadius: 6,
      fill: false,
      borderDash: [5, 4],
    });
  }

  const ctx = document.getElementById("perf-chart").getContext("2d");
  new Chart(ctx, {
    type: "line",
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: {
          labels: { color: "#8b90a7", boxWidth: 12, padding: 16 },
        },
        tooltip: {
          backgroundColor: "#1a1d27",
          borderColor: "#2e3347",
          borderWidth: 1,
          titleColor: "#e8eaf0",
          bodyColor: "#8b90a7",
          callbacks: {
            label: ctx => ` ${ctx.dataset.label}: ${fmtPct(ctx.parsed.y)}`,
          },
        },
      },
      scales: {
        x: {
          ticks: { color: "#8b90a7", maxTicksLimit: 8, maxRotation: 0 },
          grid: { color: "#2e3347" },
        },
        y: {
          ticks: {
            color: "#8b90a7",
            callback: v => fmtPct(v),
          },
          grid: { color: "#2e3347" },
        },
      },
    },
  });
}

// ── Portfolio cards ────────────────────────────────────────────────────────
async function buildPortfolioCards(portfolios, history) {
  const grid = document.getElementById("portfolios-grid");
  const entries = history.entries || [];
  const latest = entries[entries.length - 1] || {};

  // Fetch current prices for all tickers
  const allTickers = new Set();
  for (const p of Object.values(portfolios)) {
    for (const h of (p.holdings || [])) allTickers.add(h.ticker);
  }

  // We'll use the last history entry's implied prices if available,
  // otherwise show N/A. (Prices are embedded via update.py.)
  // For live price lookup we'd need a CORS-friendly API; here we use
  // the most-recent history snapshot for display accuracy.
  // The update script keeps history fresh every 30 min during market hours.

  for (const [key, p] of Object.entries(portfolios)) {
    const startVal = p.starting_cash;
    const currentVal = latest[key] ?? null;
    const totalReturn = currentVal != null ? ((currentVal - startVal) / startVal) * 100 : null;

    const card = document.createElement("div");
    card.className = "portfolio-card";

    const returnStr = totalReturn != null
      ? `<span class="${returnClass(totalReturn)}">${fmtPct(totalReturn)}</span>`
      : `<span class="neu">—</span>`;

    card.innerHTML = `
      <div class="portfolio-card-header">
        <div class="portfolio-card-title">
          <div class="ai-dot" style="background:${p.color}"></div>
          <span>${p.name}</span>
        </div>
        <div class="portfolio-value">
          <div class="total">${currentVal != null ? fmtDollar(currentVal) : "—"}</div>
          <div class="return">${returnStr} since inception</div>
        </div>
      </div>
      ${buildHoldingsTable(p)}
    `;
    grid.appendChild(card);
  }
}

function buildHoldingsTable(portfolio) {
  const holdings = portfolio.holdings || [];
  if (holdings.length === 0 && (portfolio.cash ?? 0) === portfolio.starting_cash) {
    return `<div class="empty-state">No holdings yet — all cash ($${fmt(portfolio.cash)})</div>`;
  }

  let rows = holdings.map(h => {
    const posValue = h.shares * (h.current_price ?? 0);
    const costBasis = h.shares * (h.avg_cost ?? 0);
    const gainLoss = h.current_price != null && h.avg_cost != null
      ? posValue - costBasis : null;
    const gainPct = gainLoss != null && costBasis > 0
      ? (gainLoss / costBasis) * 100 : null;
    const totalPortfolio = holdings.reduce((s, x) => s + x.shares * (x.current_price ?? 0), 0) + (portfolio.cash ?? 0);
    const weight = totalPortfolio > 0 ? (posValue / totalPortfolio) * 100 : null;

    const glStr = gainLoss != null
      ? `<span class="${returnClass(gainLoss)}">${gainLoss >= 0 ? "+" : ""}${fmtDollar(gainLoss)}</span>`
      : "—";
    const wtStr = weight != null ? fmt(weight) + "%" : "—";
    const priceStr = h.current_price != null ? fmtDollar(h.current_price) : "—";
    const valStr = h.current_price != null ? fmtDollar(posValue) : "—";

    return `<tr>
      <td>${h.ticker}</td>
      <td>${fmt(h.shares, 0)}</td>
      <td>${priceStr}</td>
      <td>${valStr}</td>
      <td>${wtStr}</td>
      <td>${glStr}</td>
    </tr>`;
  }).join("");

  // Cash row
  if (portfolio.cash > 0) {
    const totalPortfolio = holdings.reduce((s, h) => s + h.shares * (h.current_price ?? 0), 0) + portfolio.cash;
    const cashWeight = totalPortfolio > 0 ? (portfolio.cash / totalPortfolio) * 100 : 100;
    rows += `<tr class="cash-row">
      <td>CASH</td>
      <td>—</td>
      <td>—</td>
      <td>${fmtDollar(portfolio.cash)}</td>
      <td>${fmt(cashWeight)}%</td>
      <td>—</td>
    </tr>`;
  }

  return `
    <table class="holdings-table">
      <thead>
        <tr>
          <th>Ticker</th>
          <th>Shares</th>
          <th>Price</th>
          <th>Value</th>
          <th>Weight</th>
          <th>Gain/Loss</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
}

// ── Trades log ─────────────────────────────────────────────────────────────
function buildTradesTable(trades, portfolios) {
  const container = document.getElementById("trades-container");
  const list = (trades.trades || []).slice().reverse();

  if (list.length === 0) {
    container.innerHTML = `<div class="empty-state">No trades recorded yet.</div>`;
    return;
  }

  const colorMap = Object.fromEntries(
    Object.entries(portfolios).map(([, p]) => [p.name.toLowerCase(), p.color])
  );

  const rows = list.map(t => {
    const color = colorMap[t.ai?.toLowerCase()] ?? "#8b90a7";
    const badgeClass = t.action?.toLowerCase() === "buy" ? "badge-buy" : "badge-sell";
    return `<tr>
      <td>${t.date ?? "—"}</td>
      <td><span class="ai-tag" style="background:${color}22;color:${color}">${t.ai ?? "—"}</span></td>
      <td>${t.ticker ?? "—"}</td>
      <td><span class="badge ${badgeClass}">${t.action ?? "—"}</span></td>
      <td style="text-align:right">${t.shares != null ? fmt(t.shares, 0) : "—"}</td>
      <td style="text-align:right">${t.price != null ? fmtDollar(t.price) : "—"}</td>
      <td class="rationale hide-mobile">${t.rationale ?? ""}</td>
    </tr>`;
  }).join("");

  container.innerHTML = `
    <table class="trades-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>AI</th>
          <th>Ticker</th>
          <th>Action</th>
          <th style="text-align:right">Shares</th>
          <th style="text-align:right">Price</th>
          <th class="hide-mobile">Rationale</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
}

// ── Last updated ───────────────────────────────────────────────────────────
function setLastUpdated(history) {
  const entries = history.entries || [];
  if (!entries.length) return;
  const last = entries[entries.length - 1].timestamp;
  const d = new Date(last);
  document.getElementById("last-updated").textContent =
    "Last updated: " + d.toLocaleString("en-US", { dateStyle: "medium", timeStyle: "short" });
}

// ── Main ───────────────────────────────────────────────────────────────────
async function init() {
  try {
    const [portfolios, history, trades] = await Promise.all([
      fetchJSON("data/portfolios.json"),
      fetchJSON("data/history.json"),
      fetchJSON("data/trades.json"),
    ]);

    document.getElementById("loading").style.display = "none";
    document.getElementById("app").style.display = "flex";

    setLastUpdated(history);
    buildChart(history, portfolios);
    await buildPortfolioCards(portfolios, history);
    buildTradesTable(trades, portfolios);
  } catch (err) {
    document.getElementById("loading").innerHTML =
      `<div style="color:#ef4444">Error loading data: ${err.message}</div>`;
    console.error(err);
  }
}

init();
</script>
</body>
</html>
