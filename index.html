<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Trading Competition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #08091180;
      --bg-solid: #080911;
      --surface: #0e1120;
      --surface2: #141827;
      --surface3: #1a1f30;
      --border: #1c2136;
      --border-mid: #232a42;
      --text: #edf0f8;
      --muted: #5e6787;
      --muted-mid: #8b92ae;
      --claude: #f97316;
      --gpt: #22c55e;
      --gemini: #3b82f6;
      --spy: #a855f7;
      --red: #f04747;
      --green: #22c55e;
      --num-font: ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
    }

    body {
      background: var(--bg-solid);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(to bottom, #0c0f1e, var(--bg-solid));
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 1140px;
      margin: 0 auto;
      padding: 28px 28px 22px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .header-brand h1 {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text);
    }

    .header-sub {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 3px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-weight: 500;
    }

    .header-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      padding-top: 2px;
    }

    #last-updated {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.01em;
    }

    /* ── Layout ── */
    main {
      max-width: 1140px;
      margin: 0 auto;
      padding: 36px 28px 60px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    @media (max-width: 600px) {
      .header-inner { padding: 20px 18px 16px; }
      main { padding: 24px 18px 48px; gap: 20px; }
    }

    /* ── Shared card shell ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }

    .card-header {
      padding: 18px 22px 14px;
      border-bottom: 1px solid var(--border);
    }

    .section-label {
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    /* ── Chart card ── */
    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px 24px 20px;
    }

    .chart-card .section-label {
      display: block;
      margin-bottom: 18px;
    }

    .chart-wrapper {
      position: relative;
      height: 320px;
    }

    @media (max-width: 600px) {
      .chart-wrapper { height: 220px; }
    }

    .chart-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      pointer-events: none;
      z-index: 0;
    }

    .chart-placeholder svg {
      opacity: 0.2;
    }

    .chart-placeholder p {
      font-size: 0.82rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
      max-width: 280px;
    }

    #perf-chart {
      position: relative;
      z-index: 1;
    }

    /* ── Portfolio cards grid ── */
    .portfolios-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 18px;
    }

    .portfolio-card {
      --accent: var(--border-mid);
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 3px solid var(--accent);
      border-radius: 14px;
      overflow: hidden;
      transition: box-shadow 0.2s ease, transform 0.18s ease;
    }

    .portfolio-card:hover {
      transform: translateY(-2px);
      box-shadow:
        0 0 0 1px color-mix(in srgb, var(--accent) 22%, transparent),
        0 8px 32px -4px color-mix(in srgb, var(--accent) 14%, transparent),
        0 2px 8px rgba(0,0,0,0.4);
    }

    .portfolio-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(
        135deg,
        color-mix(in srgb, var(--accent) 7%, var(--surface)) 0%,
        var(--surface) 55%
      );
    }

    .portfolio-card-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ai-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 6px var(--accent);
    }

    .portfolio-card-title span {
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: -0.01em;
    }

    .portfolio-value {
      text-align: right;
    }

    .portfolio-value .total {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      font-family: var(--num-font);
      font-variant-numeric: tabular-nums;
    }

    .portfolio-value .return {
      font-size: 0.75rem;
      font-weight: 600;
      margin-top: 1px;
      font-variant-numeric: tabular-nums;
    }

    .pos { color: var(--green); }
    .neg { color: var(--red); }
    .neu { color: var(--muted); }

    /* ── Holdings table ── */
    .holdings-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.79rem;
    }

    .holdings-table th {
      color: var(--muted);
      text-align: right;
      padding: 9px 14px 7px;
      font-weight: 500;
      font-size: 0.66rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      background: var(--surface2);
    }

    .holdings-table th:first-child { text-align: left; }

    .holdings-table td {
      padding: 9px 14px;
      border-top: 1px solid var(--border);
      text-align: right;
      white-space: nowrap;
      font-family: var(--num-font);
      font-variant-numeric: tabular-nums;
      font-size: 0.78rem;
      color: var(--muted-mid);
    }

    .holdings-table td:first-child {
      text-align: left;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.79rem;
      color: var(--text);
      letter-spacing: 0.02em;
    }

    .holdings-table tr:hover td {
      background: var(--surface3);
    }

    .cash-row td {
      color: var(--muted);
      font-style: italic;
    }

    .cash-row td:first-child {
      color: var(--muted);
    }

    /* ── Empty state ── */
    .empty-state {
      padding: 28px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 0.82rem;
    }

    /* ── Loading ── */
    #loading {
      text-align: center;
      padding: 100px 20px;
      color: var(--muted);
    }

    .spinner {
      display: inline-block;
      width: 22px;
      height: 22px;
      border: 2px solid var(--border-mid);
      border-top-color: var(--muted-mid);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-bottom: 14px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Trades card ── */
    .trades-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }

    .trades-card .card-header {
      padding: 18px 22px 14px;
    }

    .trades-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.79rem;
    }

    .trades-table th {
      color: var(--muted);
      text-align: left;
      padding: 9px 16px 7px;
      font-weight: 500;
      font-size: 0.66rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      background: var(--surface2);
    }

    .trades-table td {
      padding: 10px 16px;
      border-top: 1px solid var(--border);
      color: var(--muted-mid);
    }

    .trades-table tr:hover td { background: var(--surface3); }

    .trades-table td:nth-child(5),
    .trades-table td:nth-child(6) {
      font-family: var(--num-font);
      font-variant-numeric: tabular-nums;
    }

    .badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 5px;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .badge-buy  { background: rgba(34,197,94,0.12); color: var(--green); border: 1px solid rgba(34,197,94,0.2); }
    .badge-sell { background: rgba(240,71,71,0.12);  color: var(--red);   border: 1px solid rgba(240,71,71,0.2); }

    .ai-tag {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 5px;
      font-size: 0.68rem;
      font-weight: 600;
    }

    .rationale {
      color: var(--muted);
      max-width: 300px;
      font-size: 0.76rem;
    }

    @media (max-width: 700px) {
      .trades-table .hide-mobile { display: none; }
      .portfolios-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-brand">
      <h1>AI Trading Competition</h1>
      <p class="header-sub">Live portfolio tracker</p>
    </div>
    <div class="header-meta">
      <span id="last-updated"></span>
    </div>
  </div>
</header>

<div id="loading">
  <div class="spinner"></div>
  <div>Loading portfolio data…</div>
</div>

<main id="app" style="display:none">

  <section class="chart-card">
    <span class="section-label">% Return Since Inception</span>
    <div class="chart-wrapper">
      <div class="chart-placeholder" id="chart-placeholder">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--muted-mid)">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        <p>Waiting for the first data points —<br>the chart fills in as the tracker runs.</p>
      </div>
      <canvas id="perf-chart"></canvas>
    </div>
  </section>

  <section class="portfolios-grid" id="portfolios-grid"></section>

  <section class="trades-card">
    <div class="card-header">
      <span class="section-label">Trade Log</span>
    </div>
    <div id="trades-container"></div>
  </section>

</main>

<script>
const CACHE_BUST = () => `?v=${Date.now()}`;

async function fetchJSON(url) {
  const res = await fetch(url + CACHE_BUST());
  if (!res.ok) throw new Error(`Failed to fetch ${url}: ${res.status}`);
  return res.json();
}

function fmt(n, decimals = 2) {
  return n.toLocaleString("en-US", { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}

function fmtDollar(n) { return "$" + fmt(n); }

function fmtPct(n) {
  const sign = n >= 0 ? "+" : "";
  return sign + fmt(n) + "%";
}

function returnClass(n) { return n > 0 ? "pos" : n < 0 ? "neg" : "neu"; }

// ── Chart ──────────────────────────────────────────────────────────────────
function buildChart(history, portfolios) {
  const entries = history.entries || [];
  if (entries.length === 0) return;

  const spyStart = history.spy_start;

  const labels = entries.map(e => {
    const d = new Date(e.timestamp);
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  });

  function pctReturn(key, startVal) {
    return entries.map(e => {
      const v = e[key];
      if (v == null) return null;
      return ((v - startVal) / startVal) * 100;
    });
  }

  const datasets = [];

  for (const [key, p] of Object.entries(portfolios)) {
    const startVal = p.starting_cash;
    datasets.push({
      label: p.name,
      data: pctReturn(key, startVal),
      borderColor: p.color,
      backgroundColor: p.color + "18",
      tension: 0.3,
      pointRadius: entries.length < 20 ? 4 : 2,
      pointHoverRadius: 6,
      fill: false,
    });
  }

  // SPY benchmark
  if (spyStart) {
    datasets.push({
      label: "SPY",
      data: entries.map(e => e.spy != null ? ((e.spy - spyStart) / spyStart) * 100 : null),
      borderColor: "#a855f7",
      backgroundColor: "#a855f718",
      tension: 0.3,
      pointRadius: entries.length < 20 ? 4 : 2,
      pointHoverRadius: 6,
      fill: false,
      borderDash: [5, 4],
    });
  }

  const ctx = document.getElementById("perf-chart").getContext("2d");
  new Chart(ctx, {
    type: "line",
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: {
          labels: { color: "#8b92ae", boxWidth: 12, padding: 18, font: { size: 12 } },
        },
        tooltip: {
          backgroundColor: "#0e1120",
          borderColor: "#1c2136",
          borderWidth: 1,
          titleColor: "#edf0f8",
          bodyColor: "#8b92ae",
          padding: 10,
          callbacks: {
            label: ctx => ` ${ctx.dataset.label}: ${fmtPct(ctx.parsed.y)}`,
          },
        },
      },
      scales: {
        x: {
          ticks: { color: "#5e6787", maxTicksLimit: 8, maxRotation: 0, font: { size: 11 } },
          grid: { color: "#1c2136" },
          border: { color: "#1c2136" },
        },
        y: {
          ticks: {
            color: "#5e6787",
            font: { size: 11 },
            callback: v => fmtPct(v),
          },
          grid: { color: "#1c2136" },
          border: { color: "#1c2136" },
        },
      },
    },
  });

  const ph = document.getElementById("chart-placeholder");
  if (ph) ph.style.display = "none";
}

// ── Portfolio cards ────────────────────────────────────────────────────────
async function buildPortfolioCards(portfolios, history) {
  const grid = document.getElementById("portfolios-grid");
  const entries = history.entries || [];
  const latest = entries[entries.length - 1] || {};

  // Fetch current prices for all tickers
  const allTickers = new Set();
  for (const p of Object.values(portfolios)) {
    for (const h of (p.holdings || [])) allTickers.add(h.ticker);
  }

  // We'll use the last history entry's implied prices if available,
  // otherwise show N/A. (Prices are embedded via update.py.)
  // For live price lookup we'd need a CORS-friendly API; here we use
  // the most-recent history snapshot for display accuracy.
  // The update script keeps history fresh every 30 min during market hours.

  for (const [key, p] of Object.entries(portfolios)) {
    const startVal = p.starting_cash;
    const currentVal = latest[key] ?? null;
    const totalReturn = currentVal != null ? ((currentVal - startVal) / startVal) * 100 : null;

    const card = document.createElement("div");
    card.className = "portfolio-card";
    card.style.setProperty("--accent", p.color);

    const returnStr = totalReturn != null
      ? `<span class="${returnClass(totalReturn)}">${fmtPct(totalReturn)}</span>`
      : `<span class="neu">—</span>`;

    card.innerHTML = `
      <div class="portfolio-card-header">
        <div class="portfolio-card-title">
          <div class="ai-dot" style="background:${p.color}"></div>
          <span>${p.name}</span>
        </div>
        <div class="portfolio-value">
          <div class="total">${currentVal != null ? fmtDollar(currentVal) : "—"}</div>
          <div class="return">${returnStr} since inception</div>
        </div>
      </div>
      ${buildHoldingsTable(p)}
    `;
    grid.appendChild(card);
  }
}

function buildHoldingsTable(portfolio) {
  const holdings = portfolio.holdings || [];
  if (holdings.length === 0 && (portfolio.cash ?? 0) === portfolio.starting_cash) {
    return `<div class="empty-state">No holdings yet — all cash ($${fmt(portfolio.cash)})</div>`;
  }

  let rows = holdings.map(h => {
    const posValue = h.shares * (h.current_price ?? 0);
    const costBasis = h.shares * (h.avg_cost ?? 0);
    const gainLoss = h.current_price != null && h.avg_cost != null
      ? posValue - costBasis : null;
    const gainPct = gainLoss != null && costBasis > 0
      ? (gainLoss / costBasis) * 100 : null;
    const totalPortfolio = holdings.reduce((s, x) => s + x.shares * (x.current_price ?? 0), 0) + (portfolio.cash ?? 0);
    const weight = totalPortfolio > 0 ? (posValue / totalPortfolio) * 100 : null;

    const glStr = gainLoss != null
      ? `<span class="${returnClass(gainLoss)}">${gainLoss >= 0 ? "+" : ""}${fmtDollar(gainLoss)}</span>`
      : "—";
    const wtStr = weight != null ? fmt(weight) + "%" : "—";
    const priceStr = h.current_price != null ? fmtDollar(h.current_price) : "—";
    const valStr = h.current_price != null ? fmtDollar(posValue) : "—";

    return `<tr>
      <td>${h.ticker}</td>
      <td>${fmt(h.shares, 0)}</td>
      <td>${priceStr}</td>
      <td>${valStr}</td>
      <td>${wtStr}</td>
      <td>${glStr}</td>
    </tr>`;
  }).join("");

  // Cash row
  if (portfolio.cash > 0) {
    const totalPortfolio = holdings.reduce((s, h) => s + h.shares * (h.current_price ?? 0), 0) + portfolio.cash;
    const cashWeight = totalPortfolio > 0 ? (portfolio.cash / totalPortfolio) * 100 : 100;
    rows += `<tr class="cash-row">
      <td>CASH</td>
      <td>—</td>
      <td>—</td>
      <td>${fmtDollar(portfolio.cash)}</td>
      <td>${fmt(cashWeight)}%</td>
      <td>—</td>
    </tr>`;
  }

  return `
    <table class="holdings-table">
      <thead>
        <tr>
          <th>Ticker</th>
          <th>Shares</th>
          <th>Price</th>
          <th>Value</th>
          <th>Weight</th>
          <th>Gain/Loss</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
}

// ── Trades log ─────────────────────────────────────────────────────────────
function buildTradesTable(trades, portfolios) {
  const container = document.getElementById("trades-container");
  const list = (trades.trades || []).slice().reverse();

  if (list.length === 0) {
    container.innerHTML = `<div class="empty-state">No trades recorded yet.</div>`;
    return;
  }

  const colorMap = Object.fromEntries(
    Object.entries(portfolios).map(([, p]) => [p.name.toLowerCase(), p.color])
  );

  const rows = list.map(t => {
    const color = colorMap[t.ai?.toLowerCase()] ?? "#8b90a7";
    const badgeClass = t.action?.toLowerCase() === "buy" ? "badge-buy" : "badge-sell";
    return `<tr>
      <td>${t.date ?? "—"}</td>
      <td><span class="ai-tag" style="background:${color}18;color:${color};border:1px solid ${color}30">${t.ai ?? "—"}</span></td>
      <td>${t.ticker ?? "—"}</td>
      <td><span class="badge ${badgeClass}">${t.action ?? "—"}</span></td>
      <td style="text-align:right">${t.shares != null ? fmt(t.shares, 0) : "—"}</td>
      <td style="text-align:right">${t.price != null ? fmtDollar(t.price) : "—"}</td>
      <td class="rationale hide-mobile">${t.rationale ?? ""}</td>
    </tr>`;
  }).join("");

  container.innerHTML = `
    <table class="trades-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>AI</th>
          <th>Ticker</th>
          <th>Action</th>
          <th style="text-align:right">Shares</th>
          <th style="text-align:right">Price</th>
          <th class="hide-mobile">Rationale</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
}

// ── Last updated ───────────────────────────────────────────────────────────
function setLastUpdated(history) {
  const entries = history.entries || [];
  if (!entries.length) return;
  const last = entries[entries.length - 1].timestamp;
  const d = new Date(last);
  document.getElementById("last-updated").textContent =
    "Last updated: " + d.toLocaleString("en-US", { dateStyle: "medium", timeStyle: "short" });
}

// ── Main ───────────────────────────────────────────────────────────────────
async function init() {
  try {
    const [portfolios, history, trades] = await Promise.all([
      fetchJSON("data/portfolios.json"),
      fetchJSON("data/history.json"),
      fetchJSON("data/trades.json"),
    ]);

    document.getElementById("loading").style.display = "none";
    document.getElementById("app").style.display = "flex";

    setLastUpdated(history);
    buildChart(history, portfolios);
    await buildPortfolioCards(portfolios, history);
    buildTradesTable(trades, portfolios);
  } catch (err) {
    document.getElementById("loading").innerHTML =
      `<div style="color:#f04747">Error loading data: ${err.message}</div>`;
    console.error(err);
  }
}

init();
</script>
</body>
</html>
