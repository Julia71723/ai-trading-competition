# LEGACY — This workflow is disabled.
#
# Market data is now fetched server-side at request time by the Next.js
# API routes (/api/market-data and /api/market-history) via Twelve Data,
# with CDN-layer caching. No scheduled job or data-file commits are needed.
#
# This file is kept for reference only. Re-enable it only if you need to
# switch back to a static-site / commit-based data pipeline.

name: "[DISABLED] Legacy Portfolio Data Update"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type LEGACY to confirm you want to run the old pipeline"
        required: true

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Abort if not explicitly confirmed
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "LEGACY" ]; then
            echo "This workflow is disabled. See comments in update.yml."
            exit 1
          fi
          echo "Running legacy update pipeline..."
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python scripts/update.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/portfolios.json
          git diff --cached --quiet || git commit -m "chore: legacy update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
